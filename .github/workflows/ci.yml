name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: ["1.26", "1.27"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: vet
        run: go vet ./...
      - name: build
        run: go build ./...
      - name: test
        run: go test -race -count=1 ./...

  integration:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        helm: ["v3.22.1", "v4.3.1"]
    name: integration (helm ${{ matrix.helm }})
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
      - name: install helm
        uses: azure/setup-helm@v5
        with:
          version: ${{ matrix.helm }}
      - name: real helm render diff (replicaCount 2 -> 3)
        run: |
          # Capture output; the tool exits 1 when a change is present, so don't
          # let that fail the step (|| true), then assert on the content.
          out="$(go run ./cmd/helm-values-differ examples/demo-chart \
            --base examples/base.yaml --candidate examples/candidate.yaml || true)"
          echo "$out"
          echo "$out" | grep -q 'spec.replicas: 2 → 3' || { echo "missing expected diff"; exit 1; }
          echo "$out" | grep -q '1 changed, 0 added, 0 removed' || { echo "unexpected extra changes"; exit 1; }
